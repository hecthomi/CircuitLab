<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1e33"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="trazo" x1="60" y1="120" x2="452" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="#0e1a2e"/>

  <!-- pista de circuito -->
  <path d="M96 300 H160 L196 196 L256 372 L312 232 L344 300 H416"
        fill="none" stroke="#22d3ee" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodos -->
  <circle cx="96" cy="300" r="20" fill="#22d3ee"/>
  <circle cx="416" cy="300" r="20" fill="#818cf8"/>

  <!-- LED encendido -->
  <circle cx="256" cy="372" r="30" fill="#fbbf24" filter="url(#brillo)" opacity=".95"/>
  <circle cx="256" cy="372" r="13" fill="#fff8e1"/>

  <!-- agujeros de protoboard -->
  <g fill="#22d3ee" opacity=".38">
    <rect x="120" y="404" width="14" height="14" rx="3"/>
    <rect x="152" y="404" width="14" height="14" rx="3"/>
    <rect x="184" y="404" width="14" height="14" rx="3"/>
    <rect x="314" y="404" width="14" height="14" rx="3"/>
    <rect x="346" y="404" width="14" height="14" rx="3"/>
    <rect x="378" y="404" width="14" height="14" rx="3"/>
    <rect x="120" y="94" width="14" height="14" rx="3"/>
    <rect x="152" y="94" width="14" height="14" rx="3"/>
    <rect x="346" y="94" width="14" height="14" rx="3"/>
    <rect x="378" y="94" width="14" height="14" rx="3"/>
  </g>
</svg>
